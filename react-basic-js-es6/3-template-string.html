<!DOCTYPE html>
<html>
<head>
    <title>React Basic</title>
</head>
<body>
<!-- Learning React Basic. -->
<div class="wrap">
	<h1>React Basic Learning - Template string</h1>
    <p>See the console for output</p>
    <script type="text/javascript">
        let biodata = {name: 'Dinesh', age: 32, born: 'UP'};
        console.log(biodata);
        const {name, age, born} = biodata;
        console.log(name)
        console.log(age)
        console.log(born)
        let show = `My name is ${name}, age: ${age}. Born: ${born}`;
        console.log(show)
    </script>
</div>
</body>

</html>
