<!DOCTYPE html>
<html>
<head>
    <title>React Basic</title>
</head>
<body>
<!-- Learning React Basic. -->
<div class="wrap">
	<h1>React Basic Learning - Default Arguments</h1>
    <p>See the console for output</p>
    <script type="text/javascript">
        const funcAge = (age) => {return age}; //parameter age.
        console.log(funcAge(20));

        const funcAges = (age=18) => {return age}; //parameter age, default arguments 18
        console.log(funcAges()); // Default arguments 18
        console.log(funcAges(25)); //Arguments 25

    </script>
</div>
</body>

</html>
